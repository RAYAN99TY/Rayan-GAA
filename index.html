<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mojo Pro Launcher</title>
    <style>
        body { margin: 0; background: #1a1a1a; font-family: sans-serif; overflow: hidden; color: white; }
        /* خلفية موجو الأصلية */
        .bg-video { position: fixed; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4); }
        
        /* القائمة الجانبية */
        .sidebar { position: absolute; left: 0; top: 0; width: 60px; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; padding-top: 20px; border-right: 1px solid #444; }
        .side-icon { width: 35px; height: 35px; margin-bottom: 25px; cursor: pointer; opacity: 0.7; }
        .side-icon:hover { opacity: 1; }

        /* منطقة تسجيل الدخول (مثل بوجاف) */
        .login-box { position: absolute; left: 100px; bottom: 50px; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 10px; width: 300px; }
        .version-select { width: 100%; padding: 10px; background: #333; color: white; border: 1px solid #555; margin-top: 10px; }

        /* زر PLAY الضخم */
        .play-btn { position: absolute; right: 50px; bottom: 50px; background: #cf1b1b; color: white; padding: 20px 80px; font-size: 24px; font-weight: bold; border: none; border-bottom: 5px solid #8b1212; cursor: pointer; border-radius: 5px; }
        .play-btn:active { transform: translateY(3px); border-bottom: 2px solid #8b1212; }

        /* شاشة التحميل السوداء */
        #loading-screen { display: none; position: fixed; inset: 0; background: black; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; }
        .progress-bar { width: 300px; height: 10px; background: #333; margin-top: 20px; border-radius: 5px; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: #cf1b1b; transition: 0.1s; }
    </style>
</head>
<body>

<img class="bg-video" src="https://wallpaperaccess.com/full/4656455.jpg">

<div class="sidebar">
    <div class="side-icon">🏠</div>
    <div class="side-icon">⚙️</div>
    <div class="side-icon">📜</div>
    <div class="side-icon">💬</div>
</div>

<div class="login-box">
    <div style="font-size: 14px; color: #aaa;">Welcome, Player</div>
    <div style="font-size: 18px; font-weight: bold;">Guest Account</div>
    <select class="version-select">
        <option>Latest Release (1.20.1)</option>
        <option>Forge-1.16.5</option>
        <option>OptiFine-1.12.2</option>
    </select>
</div>

<button class="play-btn" onclick="startLoading()">PLAY</button>

<div id="loading-screen">
    <img src="https://pujavlauncher.com/logo.png" width="100">
    <div class="progress-bar"><div id="fill" class="progress-fill"></div></div>
    <div id="status" style="margin-top: 10px; font-size: 12px; color: #888;">Initializing...</div>
</div>

<script>
function startLoading() {
    document.getElementById('loading-screen').style.display = 'flex';
    let fill = document.getElementById('fill');
    let status = document.getElementById('status');
    let width = 0;
    
    let interval = setInterval(() => {
        if (width >= 100) {
            clearInterval(interval);
            status.innerText = "Launching Game...";
            setTimeout(() => {
                alert("تم تشغيل محرك ماين كرافت! سيظهر العالم الآن...");
                // هنا يمكن ربط محرك الـ 3D الذي صنعناه سابقاً
            }, 1000);
        } else {
            width += Math.random() * 5;
            fill.style.width = width + '%';
            if(width > 30) status.innerText = "Downloading Assets...";
            if(width > 70) status.innerText = "Loading Libraries...";
        }
    }, 150);
}
</script>

</body>
</html>
